<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Unscramble - AI Learning Hub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="timer-bar">
    <span class="timer-label">Session:</span>
    <span class="timer-value" id="timer-value">00:00</span>
    <div class="timer-controls">
        <button onclick="Utils.goTo('index.html')">Back to Hub</button>
    </div>
</div>

<div id="app" class="game-page" style="padding-top: 50px;">
    <div class="game-header">
        <button class="back-btn" onclick="Utils.goTo('index.html')">&larr; Back</button>
        <h2>🧩 Word Unscramble</h2>
        <div></div>
    </div>

    <div class="config-panel">
        <div class="config-row">
            <label>Language:</label>
            <select id="sel-lang">
                <option value="en">English</option>
                <option value="zh">中文</option>
            </select>
            <label>Level:</label>
            <select id="sel-level">
                <option value="beginner">Beginner</option>
                <option value="intermediate" selected>Intermediate</option>
                <option value="advanced">Advanced</option>
            </select>
            <label>Count:</label>
            <select id="sel-count">
                <option value="3">3</option>
                <option value="5" selected>5</option>
                <option value="8">8</option>
            </select>
            <label>Topic:</label>
            <select id="sel-topic">
                <option value="daily_life">Daily Life</option>
                <option value="travel">Travel</option>
                <option value="work">Work</option>
                <option value="ielts">IELTS</option>
            </select>
            <button class="btn" onclick="generate()">Generate</button>
        </div>
    </div>

    <div id="loading" class="loading" style="display:none;">
        <div class="spinner"></div>
        <p>Preparing sentences...</p>
    </div>

    <div id="game-content" style="display:none;">
        <div id="questions-container"></div>
        <div class="btn-group">
            <button class="btn" id="btn-check" onclick="checkAll()">Check Answers</button>
            <button class="btn btn-success" id="btn-retry" style="display:none;" onclick="generate()">Try Again</button>
        </div>
    </div>

    <div id="result" class="result-card" style="display:none;"></div>
</div>

<script src="js/utils.js"></script>
<script src="js/bridge.js"></script>
<script>
const MOCK_SENTENCES = {
    en: {
        daily_life: [
            "She enjoys reading books in the park",
            "They have been friends since childhood",
            "I usually drink coffee in the morning",
            "The train arrives at the station at noon",
            "We are planning a trip to the mountains",
            "He works as a software engineer",
            "She speaks three languages fluently",
            "The children are playing in the garden"
        ],
        ielts: [
            "The government should invest more in renewable energy",
            "Global warming has become a serious concern worldwide",
            "Education plays a crucial role in personal development",
            "Many people believe that technology improves our quality of life",
            "Urbanization has led to significant changes in society"
        ]
    },
    zh: {
        daily_life: [
            "我每天早晨都喝一杯咖啡",
            "他正在图书馆里学习",
            "我们周末一起去公园散步",
            "她喜欢在晚上听音乐",
            "这家餐厅的菜非常好吃",
            "明天可能会下雨",
            "我已经在这家公司工作了五年",
            "请把窗户打开"
        ]
    }
};

let currentQuestions = [];
let userAnswers = [];

function generate() {
    const lang = document.getElementById('sel-lang').value;
    const level = document.getElementById('sel-level').value;
    const count = parseInt(document.getElementById('sel-count').value);
    const topic = document.getElementById('sel-topic').value;

    document.getElementById('loading').style.display = 'block';
    document.getElementById('game-content').style.display = 'none';
    document.getElementById('result').style.display = 'none';
    document.getElementById('btn-check').style.display = 'inline-block';
    document.getElementById('btn-retry').style.display = 'none';

    setTimeout(() => {
        const pool = MOCK_SENTENCES[lang]?.[topic] || MOCK_SENTENCES.en.daily_life;
        const selected = Utils.shuffle(pool).slice(0, count);

        currentQuestions = selected.map((s, idx) => {
            const words = s.split(/\s+/);
            const shuffled = Utils.shuffle(words);
            return {
                id: idx,
                correct_sentence: s,
                shuffled_words: shuffled,
                word_count: words.length
            };
        });

        userAnswers = new Array(currentQuestions.length).fill(null);
        renderQuestions();
        Bridge.send('generate', { gamemode: 'unscramble', lang, level, topic, count });
    }, 500);
}

function renderQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    currentQuestions.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'question-card fade-in';

        const num = document.createElement('div');
        num.className = 'q-number';
        num.textContent = `Question ${idx + 1} of ${currentQuestions.length} - ${q.word_count} words`;
        card.appendChild(num);

        const hint = document.createElement('div');
        hint.style.cssText = 'font-size:12px;color:var(--text-secondary);margin-bottom:8px;';
        hint.textContent = 'Click words in order to build the sentence:';
        card.appendChild(hint);

        const dropZone = document.createElement('div');
        dropZone.className = 'drop-zone';
        dropZone.id = `dropzone-${idx}`;
        card.appendChild(dropZone);

        const dragContainer = document.createElement('div');
        dragContainer.className = 'drag-container';
        dragContainer.id = `pool-${idx}`;

        q.shuffled_words.forEach((word, wi) => {
            const span = document.createElement('span');
            span.className = 'drag-word';
            span.dataset.word = word;
            span.dataset.q = idx;
            span.textContent = word;
            span.onclick = () => clickWord(idx, wi, span);
            dragContainer.appendChild(span);
        });

        card.appendChild(dragContainer);

        const resetBtn = document.createElement('button');
        resetBtn.className = 'btn btn-outline';
        resetBtn.style.cssText = 'margin-top:8px;padding:4px 12px;font-size:12px;';
        resetBtn.textContent = 'Reset';
        resetBtn.onclick = () => resetQuestion(idx);
        card.appendChild(resetBtn);

        container.appendChild(card);
    });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('game-content').style.display = 'block';
}

function clickWord(qIdx, wIdx, el) {
    const q = currentQuestions[qIdx];
    if (!userAnswers[qIdx]) userAnswers[qIdx] = [];

    const dropZone = document.getElementById(`dropzone-${qIdx}`);
    const pool = document.getElementById(`pool-${qIdx}`);

    if (el.parentElement.id === `pool-${qIdx}`) {
        const wordSpan = document.createElement('span');
        wordSpan.className = 'drag-word placed';
        wordSpan.textContent = el.textContent;
        wordSpan.dataset.word = el.dataset.word;
        wordSpan.onclick = () => {
            returnWord(qIdx, wordSpan);
        };
        dropZone.appendChild(wordSpan);
        el.remove();
        userAnswers[qIdx].push(el.dataset.word);
    }
}

function returnWord(qIdx, el) {
    const pool = document.getElementById(`pool-${qIdx}`);
    const wordSpan = document.createElement('span');
    wordSpan.className = 'drag-word';
    wordSpan.textContent = el.textContent;
    wordSpan.dataset.word = el.dataset.word;
    wordSpan.onclick = () => clickWord(qIdx, null, wordSpan);
    pool.appendChild(wordSpan);
    el.remove();
    if (userAnswers[qIdx]) {
        const idx = userAnswers[qIdx].indexOf(el.dataset.word);
        if (idx > -1) userAnswers[qIdx].splice(idx, 1);
    }
}

function resetQuestion(idx) {
    const q = currentQuestions[idx];
    const dropZone = document.getElementById(`dropzone-${idx}`);
    const pool = document.getElementById(`pool-${idx}`);

    dropZone.innerHTML = '';
    pool.innerHTML = '';

    q.shuffled_words.forEach((word) => {
        const span = document.createElement('span');
        span.className = 'drag-word';
        span.textContent = word;
        span.dataset.word = word;
        span.dataset.q = idx;
        span.onclick = () => clickWord(idx, null, span);
        pool.appendChild(span);
    });

    userAnswers[idx] = null;
}

function checkAll() {
    let correct = 0;
    const total = currentQuestions.length;

    currentQuestions.forEach((q, idx) => {
        const dropZone = document.getElementById(`dropzone-${idx}`);
        const placedWords = Array.from(dropZone.querySelectorAll('.drag-word')).map(el => el.textContent);
        const userSentence = placedWords.join(' ');
        const isCorrect = userSentence === q.correct_sentence;

        if (isCorrect) correct++;

        dropZone.querySelectorAll('.drag-word').forEach(el => {
            el.classList.remove('placed', 'correct-pos', 'wrong-pos');
            el.classList.add(isCorrect ? 'correct-pos' : 'wrong-pos');
            el.style.cursor = 'default';
            el.onclick = null;
        });

        const pool = document.getElementById(`pool-${idx}`);
        pool.querySelectorAll('.drag-word').forEach(el => {
            el.style.cursor = 'default';
            el.onclick = null;
        });
    });

    document.getElementById('btn-check').style.display = 'none';
    document.getElementById('btn-retry').style.display = 'inline-block';

    const resultEl = document.getElementById('result');
    resultEl.style.display = 'block';
    resultEl.innerHTML = `
        <div class="score">${correct}/${total}</div>
        <div class="score-label">${Math.round((correct/total)*100)}% correct</div>
        <div class="explanation">
            ${currentQuestions.map((q, idx) => `
                <div style="margin-bottom:8px;text-align:left;">
                    <strong>${idx+1}.</strong>
                    ${q.correct_sentence}
                    ${(userAnswers[idx]?.join(' ') || '(empty)') !== q.correct_sentence ?
                        `<br><span style="color:var(--text-secondary);font-size:12px;">
                            Your answer: ${userAnswers[idx]?.join(' ') || '(empty)'}
                        </span>` : ''}
                </div>
            `).join('')}
        </div>
    `;
    resultEl.scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="cloze.title">Cloze Paragraph</title>
<link rel="stylesheet" href="css/style.css">
<style>
.word-bank { display:flex; flex-wrap:wrap; gap:8px; padding:12px; background:var(--bg); border-radius:8px; margin-bottom:16px; min-height:44px; border:2px dashed var(--border); }
.word-bank-word { padding:6px 14px; background:var(--card); border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:14px; transition:all .15s; }
.word-bank-word:hover { background:var(--primary); color:#fff; }
.word-bank-word.used { opacity:.3; pointer-events:none; }
.cloze-paragraph { font-size:16px; line-height:2.2; padding:16px; background:var(--card); border-radius:8px; }
.cloze-blank { display:inline-block; min-width:80px; padding:2px 8px; border-bottom:3px dashed var(--primary); margin:0 4px; text-align:center; cursor:pointer; font-size:15px; transition:all .15s; }
.cloze-blank.filled { border-bottom-color:var(--success); background:#e8f5e9; }
.cloze-blank.active { border-bottom-color:var(--error); background:#fbe9e7; }
.cloze-blank.correct { border-bottom-color:var(--success); background:#e8f5e9; }
.cloze-blank.wrong { border-bottom-color:var(--error); background:#fbe9e7; }
.cloze-explanation { margin-top:4px; font-size:12px; color:var(--text-secondary); }
</style>
</head>
<body>

<div class="timer-bar">
    <span class="timer-label" data-i18n="cloze.title">Cloze Paragraph</span>
    <span class="timer-value" id="timer-value">00:00</span>
    <div class="timer-controls">
        <button onclick="Utils.goTo('index.html')" data-i18n="app.back">Back</button>
    </div>
</div>

<div id="app" class="game-page" style="padding-top:50px;">
    <div class="game-header">
        <h2 data-i18n="cloze.title">Cloze Paragraph</h2>
    </div>

    <div class="config-panel">
        <div class="config-row">
            <label data-i18n="app.language">Language:</label>
            <select id="sel-lang">
                <option value="en" data-i18n="app.language_en">English</option>
                <option value="zh" data-i18n="app.language_zh">Chinese</option>
            </select>
            <label data-i18n="app.level">Level:</label>
            <select id="sel-level">
                <option value="beginner">1 - Beginner</option>
                <option value="elementary">2 - Elementary</option>
                <option value="intermediate" selected>3 - Intermediate</option>
                <option value="upper_intermediate">4 - Upper-Intermediate</option>
                <option value="advanced">5 - Advanced</option>
            </select>
            <label>Blanks:</label>
            <select id="sel-blanks">
                <option value="3">3</option>
                <option value="4" selected>4</option>
                <option value="5">5</option>
                <option value="6">6</option>
            </select>
            <label data-i18n="app.topic">Topic:</label>
            <input type="text" id="input-topic" placeholder="Describe topic..." style="width:200px;padding:6px;border:2px solid var(--border);border-radius:6px;">
            <button class="btn" onclick="generate()" data-i18n="app.generate">Generate</button>
        </div>
    </div>

    <div id="loading" class="loading" style="display:none;">
        <div class="spinner"></div>
        <p data-i18n="app.loading">Generating cloze passage...</p>
    </div>

    <div id="game-content" style="display:none;">
        <div id="word-bank" class="word-bank"><div style="color:var(--text-secondary);font-size:13px;" data-i18n="cloze.word_bank">Word bank:</div></div>
        <div class="question-card">
            <div id="cloze-paragraph" class="cloze-paragraph"></div>
        </div>
        <div class="btn-group">
            <button class="btn" id="btn-check" onclick="checkAll()" data-i18n="app.check">Check Answers</button>
            <button class="btn btn-outline" onclick="resetGame()" style="display:none;" id="btn-reset">Reset</button>
            <button class="btn btn-success" id="btn-retry" style="display:none;" onclick="generate()" data-i18n="app.retry">Try Again</button>
        </div>
    </div>

    <div id="result" class="result-card" style="display:none;"></div>
</div>

<script src="js/utils.js"></script>
<script src="js/bridge.js"></script>
<script>
let currentData = null;
let blankWords = {};      // blank_id -> word user placed
let selectedBlank = -1;
let wordBankWords = [];

async function generate() {
    const lang = document.getElementById('sel-lang').value;
    const level = document.getElementById('sel-level').value;
    const topic = document.getElementById('input-topic').value.trim() || 'general';
    const numBlanks = parseInt(document.getElementById('sel-blanks').value);

    Utils.showLoading(true);
    Utils.showGameContent(false);
    document.getElementById('result').style.display = 'none';
    document.getElementById('btn-check').style.display = 'inline-block';
    document.getElementById('btn-retry').style.display = 'none';
    document.getElementById('btn-reset').style.display = 'none';

    const data = await Bridge.sendAsync('generate', {
        gamemode: 'cloze', language: lang, level, topic,
        num_blanks: numBlanks, paragraph_min_words: 60, paragraph_max_words: 120
    });

    if (data && data.blanks) {
        currentData = data;
        blankWords = {};
        selectedBlank = -1;
        renderCloze();
    } else {
        Utils.toast('Failed: ' + (data?.message || 'Error'));
    }
    Utils.showLoading(false);
}

function renderCloze() {
    // Word bank
    const bank = document.getElementById('word-bank');
    const allWords = [];
    currentData.blanks.forEach(b => {
        b.options.forEach(w => { allWords.push(w); });
    });
    wordBankWords = Utils.shuffle([...new Set(allWords)]);

    bank.innerHTML = `<div style="color:var(--text-secondary);font-size:13px;width:100%;margin-bottom:4px;">${Utils.t('cloze.word_bank', 'Word bank:')}</div>`;
    wordBankWords.forEach(w => {
        const span = document.createElement('span');
        span.className = 'word-bank-word';
        span.textContent = w;
        span.dataset.word = w;
        span.onclick = () => clickBankWord(span, w);
        bank.appendChild(span);
    });

    // Paragraph
    let html = currentData.paragraph_with_blanks || '';
    currentData.blanks.forEach(b => {
        const marker = `[BLANK_${b.blank_id}]`;
        const val = blankWords[b.blank_id] || '';
        const cls = val ? 'cloze-blank filled' : 'cloze-blank';
        html = html.replace(marker, `<span class="${cls}" data-blank="${b.blank_id}" onclick="clickBlank(${b.blank_id})">${val || '______'}</span>`);
    });
    document.getElementById('cloze-paragraph').innerHTML = html;

    Utils.showGameContent(true);
}

function clickBankWord(el, word) {
    if (el.classList.contains('used')) return;
    if (selectedBlank < 0) {
        Utils.toast('Click a blank first!', 1500);
        return;
    }
    // Find if this word belongs to this blank
    const blanks = currentData.blanks;
    const belongs = blanks.some(b => b.blank_id === selectedBlank && b.options.some(o => o === word));
    if (!belongs) {
        Utils.toast('This word does not fit here.', 1500);
        return;
    }
    blankWords[selectedBlank] = word;
    el.classList.add('used');
    renderCloze();
}

function clickBlank(bid) {
    selectedBlank = bid;
    // Remove active from all blanks
    document.querySelectorAll('.cloze-blank').forEach(el => el.classList.remove('active'));
    document.querySelector(`.cloze-blank[data-blank="${bid}"]`)?.classList.add('active');
}

function resetGame() {
    blankWords = {};
    selectedBlank = -1;
    document.querySelectorAll('.word-bank-word').forEach(el => el.classList.remove('used'));
    renderCloze();
    document.getElementById('btn-check').style.display = 'inline-block';
    document.getElementById('btn-reset').style.display = 'none';
    document.getElementById('btn-retry').style.display = 'none';
    document.getElementById('result').style.display = 'none';
}

function checkAll() {
    let correct = 0;
    const total = currentData.blanks.length;

    currentData.blanks.forEach(b => {
        const userWord = (blankWords[b.blank_id] || '').trim().toLowerCase();
        const correctWord = b.correct_word.toLowerCase();
        const isCorrect = userWord === correctWord;
        if (isCorrect) correct++;

        const el = document.querySelector(`.cloze-blank[data-blank="${b.blank_id}"]`);
        if (el) {
            el.classList.remove('active', 'filled');
            el.classList.add(isCorrect ? 'correct' : 'wrong');
            el.onclick = null;
            el.textContent = b.correct_word;
        }
    });

    // Disable word bank
    document.querySelectorAll('.word-bank-word').forEach(el => { el.style.pointerEvents = 'none'; });
    document.getElementById('btn-check').style.display = 'none';
    document.getElementById('btn-reset').style.display = 'none';
    document.getElementById('btn-retry').style.display = 'inline-block';

    const resultEl = document.getElementById('result');
    const pct = Math.round((correct / total) * 100);
    resultEl.style.display = 'block';
    resultEl.innerHTML = `
        <div class="score">${correct}/${total}</div>
        <div class="score-label">${pct}% correct</div>
        ${currentData.paragraph_full ? `<div class="explanation"><strong>Full passage:</strong><br>${currentData.paragraph_full}</div>` : ''}
    `;
    resultEl.scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>

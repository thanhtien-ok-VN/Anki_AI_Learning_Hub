<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="translation.title">AI Translation Practice</title>
<link rel="stylesheet" href="css/style.css">
<style>
.trans-exercise { max-width:600px; margin:0 auto; }
.trans-source { font-size:20px; font-weight:600; text-align:center; padding:20px; background:var(--card); border-radius:8px; margin-bottom:16px; line-height:1.5; }
.trans-input { width:100%; min-height:100px; padding:12px; border:2px solid var(--border); border-radius:8px; font-size:15px; font-family:var(--font); background:var(--bg); color:var(--text); resize:vertical; }
.trans-input:focus { border-color:var(--primary); outline:none; }
.trans-hint { font-size:12px; color:var(--text-secondary); margin-bottom:8px; }
.ai-feedback { margin-top:16px; padding:16px; border-radius:8px; font-size:14px; line-height:1.6; }
.ai-feedback h4 { margin:0 0 8px; font-size:14px; }
.ai-feedback .error-item { color:var(--error); margin:4px 0; font-size:13px; }
.ai-feedback .suggestion { color:var(--primary); font-style:italic; margin-top:8px; font-size:13px; }
.trans-nav { display:flex; justify-content:space-between; align-items:center; margin-top:16px; }
.trans-counter { font-size:13px; color:var(--text-secondary); }
</style>
</head>
<body>

<div class="timer-bar">
    <span class="timer-label" data-i18n="translation.title">Translation</span>
    <span class="timer-value" id="timer-value">00:00</span>
    <div class="timer-controls">
        <button onclick="Utils.goTo('index.html')" data-i18n="app.back">Back</button>
    </div>
</div>

<div id="app" class="game-page" style="padding-top:50px;">
    <div class="game-header">
        <h2 data-i18n="translation.title">AI Translation Practice</h2>
    </div>

    <div class="config-panel" id="config-panel">
        <div class="config-row">
            <label>Direction:</label>
            <select id="sel-dir">
                <option value="vi-en">Vi → English</option>
                <option value="vi-zh">Vi → 中文</option>
            </select>
            <label data-i18n="app.level">Level:</label>
            <select id="sel-level">
                <option value="beginner">1 - Beginner</option>
                <option value="elementary">2 - Elementary</option>
                <option value="intermediate" selected>3 - Intermediate</option>
                <option value="upper_intermediate">4 - Upper-Intermediate</option>
                <option value="advanced">5 - Advanced</option>
            </select>
            <label data-i18n="app.topic">Topic:</label>
            <input type="text" id="input-topic" placeholder="Describe topic..." style="width:180px;padding:6px;border:2px solid var(--border);border-radius:6px;">
            <label>Count:</label>
            <select id="sel-count">
                <option value="3">3</option>
                <option value="5" selected>5</option>
            </select>
            <button class="btn" onclick="generate()" data-i18n="app.generate">Generate</button>
        </div>
    </div>

    <div id="loading" class="loading" style="display:none;">
        <div class="spinner"></div>
        <p data-i18n="app.loading">Preparing translation exercise...</p>
    </div>

    <div id="game-content" style="display:none;">
        <div class="trans-exercise">
            <div class="trans-source" id="source-text">---</div>
            <div class="trans-hint" id="grammar-hint"></div>
            <textarea class="trans-input" id="user-input" placeholder="Type your translation here..." oninput="onInputChange()"></textarea>
            <div class="btn-group" style="margin-top:12px;">
                <button class="btn" id="btn-check" onclick="checkCurrent()" data-i18n="app.check">Check</button>
                <button class="btn btn-success" id="btn-next" style="display:none;" onclick="nextSentence()" data-i18n="app.next">Next →</button>
            </div>
            <div id="ai-feedback" class="ai-feedback" style="display:none;"></div>
            <div class="trans-nav">
                <span class="trans-counter" id="sentence-counter">0 / 0</span>
            </div>
        </div>
    </div>

    <div id="result" class="result-card" style="display:none;"></div>
</div>

<script src="js/utils.js"></script>
<script src="js/bridge.js"></script>
<script>
let allSentences = [];
let currentIdx = 0;
let checked = false;

async function generate() {
    const dir = document.getElementById('sel-dir').value;
    const parts = dir.split('-');
    const sourceLang = parts[0];  // vi
    const targetLang = parts[1];  // en or zh
    const level = document.getElementById('sel-level').value;
    const topic = document.getElementById('input-topic').value.trim() || 'daily life';
    const count = parseInt(document.getElementById('sel-count').value);

    Utils.showLoading(true);
    Utils.showGameContent(false);
    document.getElementById('result').style.display = 'none';

    const data = await Bridge.sendAsync('generate', {
        gamemode: 'translation',
        source_lang: sourceLang,
        target_lang: targetLang,
        language: targetLang,
        level, topic, count
    });

    if (data && data.sentences && data.sentences.length > 0) {
        allSentences = data.sentences;
        currentIdx = 0;
        checked = false;
        showSentence(0);
    } else {
        Utils.toast('Failed: ' + (data?.message || 'No data'));
    }
    Utils.showLoading(false);
}

function showSentence(idx) {
    const s = allSentences[idx];
    document.getElementById('source-text').textContent = s.source_text;
    document.getElementById('grammar-hint').textContent = s.grammar_notes ? '📖 ' + s.grammar_notes : '';
    document.getElementById('user-input').value = '';
    document.getElementById('user-input').disabled = false;
    document.getElementById('user-input').style.borderColor = 'var(--border)';
    document.getElementById('ai-feedback').style.display = 'none';
    document.getElementById('btn-check').style.display = 'inline-block';
    document.getElementById('btn-next').style.display = 'none';
    document.getElementById('sentence-counter').textContent = `${idx+1} / ${allSentences.length}`;
    checked = false;
    document.getElementById('user-input').focus();
}

function onInputChange() {
    if (checked) {
        checked = false;
        document.getElementById('btn-check').style.display = 'inline-block';
        document.getElementById('btn-next').style.display = 'none';
        document.getElementById('ai-feedback').style.display = 'none';
        document.getElementById('user-input').style.borderColor = 'var(--border)';
    }
}

async function checkCurrent() {
    const s = allSentences[currentIdx];
    const userText = document.getElementById('user-input').value.trim();
    if (!userText) { Utils.toast('Please enter your translation!'); return; }

    document.getElementById('btn-check').disabled = true;
    document.getElementById('btn-check').textContent = 'Grading...';

    // Try AI grading first
    const dir = document.getElementById('sel-dir').value;
    const targetLang = dir.split('-')[1];
    const level = document.getElementById('sel-level').value;

    const aiResult = await Bridge.sendAsync('ai_grade', {
        gamemode: 'translation',
        source_text: s.source_text,
        expected_target: s.target_text,
        user_target: userText,
        source_lang: 'Vietnamese',
        target_lang: targetLang === 'en' ? 'English' : 'Chinese',
        level: level,
    });

    const isExact = userText.toLowerCase() === s.target_text.toLowerCase();

    const fb = document.getElementById('ai-feedback');
    fb.style.display = 'block';

    if (aiResult && !aiResult.error) {
        const correct = aiResult.correct || isExact;
        fb.className = 'ai-feedback ' + (correct ? 'feedback-correct' : 'feedback-wrong');
        let html = '';
        if (correct) {
            html = `<h4>✅ Correct!</h4>`;
        } else {
            html = `<h4>❌ Not quite</h4>`;
            if (aiResult.errors && aiResult.errors.length) {
                html += aiResult.errors.map(e => `<div class="error-item">• ${e}</div>`).join('');
            }
            html += `<div style="margin-top:8px;"><strong>Expected:</strong> ${s.target_text}</div>`;
            html += `<div><strong>Your answer:</strong> ${userText}</div>`;
        }
        if (aiResult.explanation) html += `<div style="margin-top:8px;font-size:13px;">${aiResult.explanation}</div>`;
        if (aiResult.suggestion) html += `<div class="suggestion">💡 ${aiResult.suggestion}</div>`;
        fb.innerHTML = html;
    } else {
        fb.className = 'ai-feedback ' + (isExact ? 'feedback-correct' : 'feedback-wrong');
        fb.innerHTML = isExact
            ? `<h4>✅ Correct!</h4>`
            : `<h4>❌ Not quite</h4><div><strong>Expected:</strong> ${s.target_text}</div><div><strong>Your answer:</strong> ${userText}</div>`;
    }

    if (s.vocabulary && s.vocabulary.length) {
        fb.innerHTML += `<div style="margin-top:12px;font-size:12px;color:var(--text-secondary);">
            <strong>Vocabulary:</strong><br>
            ${s.vocabulary.map(v => `${v.word} = ${v.translation} ${v.notes ? '— ' + v.notes : ''}`).join('<br>')}
        </div>`;
    }

    checked = true;
    document.getElementById('user-input').disabled = true;
    document.getElementById('user-input').style.borderColor = isExact ? 'var(--success)' : 'var(--error)';
    document.getElementById('btn-check').style.display = 'none';

    if (currentIdx < allSentences.length - 1) {
        document.getElementById('btn-next').style.display = 'inline-block';
    } else {
        showFinalResult();
    }
    document.getElementById('btn-check').disabled = false;
    document.getElementById('btn-check').textContent = 'Check';
}

function nextSentence() {
    currentIdx++;
    showSentence(currentIdx);
}

function showFinalResult() {
    const resultEl = document.getElementById('result');
    resultEl.style.display = 'block';
    resultEl.innerHTML = `
        <div class="score">🎉 Complete!</div>
        <div class="explanation">
            You finished all ${allSentences.length} translation exercises.
        </div>
        <button class="btn btn-success" onclick="generate()" data-i18n="app.retry">Try Again</button>
    `;
    resultEl.scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>

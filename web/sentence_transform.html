<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentence Transformation - AI Learning Hub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="timer-bar">
    <span class="timer-label">Session:</span>
    <span class="timer-value" id="timer-value">00:00</span>
    <div class="timer-controls">
        <button onclick="Utils.goTo('index.html')">Back to Hub</button>
    </div>
</div>

<div id="app" class="game-page" style="padding-top: 50px;">
    <div class="game-header">
        <button class="back-btn" onclick="Utils.goTo('index.html')">&larr; Back</button>
        <h2>🔄 Sentence Transformation</h2>
        <div></div>
    </div>

    <div class="config-panel">
        <div class="config-row">
            <label>Focus:</label>
            <select id="sel-focus">
                <option value="voice">Active &harr; Passive Voice</option>
                <option value="conditional">Conditional Sentences</option>
                <option value="reported">Direct &harr; Reported Speech</option>
                <option value="comparative">Comparative Structures</option>
            </select>
            <label>Level:</label>
            <select id="sel-level">
                <option value="intermediate" selected>Intermediate</option>
                <option value="advanced">Advanced</option>
            </select>
            <label>Count:</label>
            <select id="sel-count">
                <option value="3">3</option>
                <option value="5" selected>5</option>
            </select>
            <button class="btn" onclick="generate()">Generate</button>
        </div>
    </div>

    <div id="loading" class="loading" style="display:none;">
        <div class="spinner"></div>
        <p>Preparing transformation exercises...</p>
    </div>

    <div id="game-content" style="display:none;">
        <div id="questions-container"></div>
        <div class="btn-group">
            <button class="btn" id="btn-check" onclick="checkAll()">Submit All</button>
            <button class="btn btn-success" id="btn-retry" style="display:none;" onclick="generate()">Try Again</button>
        </div>
    </div>

    <div id="result" class="result-card" style="display:none;"></div>
</div>

<script src="js/utils.js"></script>
<script src="js/bridge.js"></script>
<script>
const MOCK = {
    voice: [
        {
            original: "The chef cooked the meal.",
            instruction: "Rewrite in passive voice. Start with 'The meal'.",
            hint: "by",
            expected: "The meal was cooked by the chef.",
            rule: "Passive: object + be (past) + past participle + by + subject"
        },
        {
            original: "The students completed the project.",
            instruction: "Rewrite in passive voice. Start with 'The project'.",
            hint: "by",
            expected: "The project was completed by the students.",
            rule: "Object becomes subject; add 'be' in same tense + past participle"
        },
        {
            original: "They will announce the results tomorrow.",
            instruction: "Rewrite in passive voice. Start with 'The results'.",
            hint: "by",
            expected: "The results will be announced tomorrow.",
            rule: "Future passive: will + be + past participle"
        },
        {
            original: "Someone has stolen my bicycle.",
            instruction: "Rewrite in passive voice. Start with 'My bicycle'.",
            hint: "been",
            expected: "My bicycle has been stolen.",
            rule: "Present perfect passive: have/has + been + past participle"
        },
        {
            original: "The company is building a new factory.",
            instruction: "Rewrite in passive voice. Start with 'A new factory'.",
            hint: "being",
            expected: "A new factory is being built by the company.",
            rule: "Present continuous passive: is/are + being + past participle"
        }
    ],
    conditional: [
        {
            original: "If it rains, we will cancel the picnic.",
            instruction: "Rewrite using 'unless' instead of 'if'.",
            hint: "unless",
            expected: "Unless it rains, we will not cancel the picnic.",
            rule: "Unless = if not. Negate the main clause when replacing 'if' with 'unless'."
        },
        {
            original: "I don't have enough money, so I can't buy the car.",
            instruction: "Rewrite as a third conditional sentence.",
            hint: "If I had",
            expected: "If I had enough money, I would buy the car.",
            rule: "Second conditional: If + past simple, would + base verb"
        }
    ]
};

let currentQuestions = [];
let userAnswers = [];

function generate() {
    const focus = document.getElementById('sel-focus').value;
    const count = parseInt(document.getElementById('sel-count').value);

    document.getElementById('loading').style.display = 'block';
    document.getElementById('game-content').style.display = 'none';
    document.getElementById('result').style.display = 'none';
    document.getElementById('btn-check').style.display = 'inline-block';
    document.getElementById('btn-retry').style.display = 'none';

    setTimeout(() => {
        currentQuestions = (MOCK[focus] || MOCK.voice).slice(0, count);
        userAnswers = new Array(count).fill('');
        renderQuestions();
        Bridge.send('generate', { gamemode: 'sentence_transform', focus, count });
    }, 500);
}

function renderQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    currentQuestions.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'question-card fade-in';

        const num = document.createElement('div');
        num.className = 'q-number';
        num.textContent = `Exercise ${idx + 1}`;
        card.appendChild(num);

        const orig = document.createElement('div');
        orig.style.cssText = 'padding:10px;background:var(--bg);border-radius:6px;margin-bottom:10px;font-size:15px;';
        orig.innerHTML = `<strong>Original:</strong> ${q.original}`;
        card.appendChild(orig);

        const inst = document.createElement('div');
        inst.style.cssText = 'font-size:13px;color:var(--text-secondary);margin-bottom:8px;';
        inst.textContent = q.instruction;
        card.appendChild(inst);

        if (q.hint) {
            const hint = document.createElement('div');
            hint.style.cssText = 'font-size:12px;color:var(--primary);margin-bottom:8px;';
            hint.innerHTML = `💡 Hint: Use the word <strong>${q.hint}</strong>`;
            card.appendChild(hint);
        }

        const rule = document.createElement('div');
        rule.style.cssText = 'font-size:12px;color:var(--text-secondary);margin-bottom:10px;font-style:italic;';
        rule.textContent = `Rule: ${q.rule}`;
        card.appendChild(rule);

        const ta = document.createElement('textarea');
        ta.style.cssText = 'width:100%;min-height:60px;padding:10px;border:2px solid var(--border);border-radius:6px;font-size:14px;font-family:var(--font);background:var(--bg);color:var(--text);resize:vertical;';
        ta.placeholder = 'Type your transformed sentence here...';
        ta.id = `transform-${idx}`;
        ta.oninput = (e) => { userAnswers[idx] = e.target.value; };
        card.appendChild(ta);

        const feedback = document.createElement('div');
        feedback.id = `feedback-${idx}`;
        feedback.style.cssText = 'margin-top:8px;font-size:13px;display:none;';
        card.appendChild(feedback);

        container.appendChild(card);
    });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('game-content').style.display = 'block';
}

function checkAll() {
    let correct = 0;
    const total = currentQuestions.length;

    currentQuestions.forEach((q, idx) => {
        const ta = document.getElementById(`transform-${idx}`);
        const fb = document.getElementById(`feedback-${idx}`);
        const userText = userAnswers[idx]?.trim().toLowerCase() || '';
        const expectedNorm = q.expected.toLowerCase();
        const isCorrect = userText === expectedNorm;

        ta.disabled = true;
        ta.style.borderColor = isCorrect ? 'var(--success)' : 'var(--error)';
        fb.style.display = 'block';

        if (isCorrect) {
            correct++;
            fb.innerHTML = `<span style="color:var(--success)">&#10003; Correct!</span>`;
        } else {
            fb.innerHTML = `
                <span style="color:var(--error)">&#10007; Not quite.</span><br>
                <span style="color:var(--text-secondary);font-size:12px;">
                    Expected: <strong>${q.expected}</strong><br>
                    Your answer: ${userAnswers[idx] || '(empty)'}
                </span>
            `;
        }
    });

    document.getElementById('btn-check').style.display = 'none';
    document.getElementById('btn-retry').style.display = 'inline-block';

    const resultEl = document.getElementById('result');
    resultEl.style.display = 'block';
    resultEl.innerHTML = `
        <div class="score">${correct}/${total}</div>
        <div class="score-label">${Math.round((correct/total)*100)}% correct</div>
        <div class="explanation">
            ${correct === total ? 'Excellent grammar transformation skills!' : 'Review the grammar rules and try again.'}
        </div>
    `;
    resultEl.scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>

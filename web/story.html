<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Generator - AI Learning Hub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="timer-bar">
    <span class="timer-label">Session:</span>
    <span class="timer-value" id="timer-value">00:00</span>
    <div class="timer-controls">
        <button onclick="Utils.goTo('index.html')">Back to Hub</button>
    </div>
</div>

<div id="app" class="game-page" style="padding-top: 50px;">
    <div class="game-header">
        <button class="back-btn" onclick="Utils.goTo('index.html')">&larr; Back</button>
        <h2>📚 Vocabulary Story Generator</h2>
        <div></div>
    </div>

    <div class="config-panel">
        <div class="config-row">
            <label>Language:</label>
            <select id="sel-lang">
                <option value="en">English</option>
                <option value="zh">中文</option>
            </select>
            <label>Level:</label>
            <select id="sel-level">
                <option value="beginner">Beginner</option>
                <option value="intermediate" selected>Intermediate</option>
                <option value="advanced">Advanced</option>
            </select>
            <label>Target Words:</label>
            <input type="text" id="input-words" value="consequence, inevitable, mitigate, scenario, adaptation" style="width:300px;" placeholder="5-7 comma-separated words">
            <button class="btn" onclick="generate()">Generate Story</button>
        </div>
    </div>

    <div id="loading" class="loading" style="display:none;">
        <div class="spinner"></div>
        <p>AI is writing a story with your words...</p>
    </div>

    <div id="game-content" style="display:none;">
        <div class="question-card">
            <div class="q-number">Story using your target vocabulary</div>
            <div id="story-text" class="story-text"></div>
            <div style="margin-top:12px;font-size:13px;color:var(--text-secondary);">
                Target words: <span id="story-words-used"></span>
            </div>
        </div>

        <div id="quiz-section">
            <div class="q-number" style="margin-bottom:12px;">Reading Comprehension</div>
            <div id="quiz-questions"></div>
        </div>

        <div class="btn-group">
            <button class="btn" id="btn-check" onclick="checkQuiz()">Check Answers</button>
            <button class="btn btn-success" id="btn-retry" style="display:none;" onclick="generate()">New Story</button>
        </div>
    </div>

    <div id="result" class="result-card" style="display:none;"></div>
</div>

<script src="js/utils.js"></script>
<script src="js/bridge.js"></script>
<script>
const MOCK_STORIES = {
    en: {
        intermediate: {
            words: ["consequence", "inevitable", "mitigate", "scenario", "adaptation"],
            story: "The inevitable consequence of rising global temperatures is the increased frequency of extreme weather events. In this scenario, coastal cities face the greatest risk. To mitigate the damage, governments must invest in flood defenses and sustainable infrastructure. Successful adaptation requires both policy changes and individual actions, such as reducing energy consumption. The long-term consequence of our choices today will determine the world we leave for future generations.",
            questions: [
                {
                    question: "What is described as an inevitable consequence of rising temperatures?",
                    options: ["Increased extreme weather", "Lower sea levels", "Better agriculture", "More forests"],
                    correct: 0
                },
                {
                    question: "What does the author suggest to mitigate damage?",
                    options: ["Ignore the problem", "Invest in flood defenses", "Move to higher ground", "Stop all construction"],
                    correct: 1
                },
                {
                    question: "What does successful adaptation require according to the passage?",
                    options: ["Only government action", "Only individual actions", "Both policy and individual actions", "No action at all"],
                    correct: 2
                }
            ]
        }
    },
    zh: {
        intermediate: {
            words: ["影响", "发展", "环境", "技术", "未来"],
            story: "科技的发展对我们的生活环境产生了深远的影响。随着新技术的不断涌现，我们必须思考如何平衡发展与环境之间的关系。未来的关键在于找到可持续的发展方式。绿色技术将在塑造美好未来的过程中发挥重要作用。每个人都应该为保护环境贡献自己的一份力量。",
            questions: [
                {
                    question: "科技发展对什么产生了影响？",
                    options: ["生活环境", "教育制度", "交通系统", "医疗水平"],
                    correct: 0
                },
                {
                    question: "未来的关键是什么？",
                    options: ["追求最大利润", "找到可持续发展方式", "停止所有发展", "发展重工业"],
                    correct: 1
                },
                {
                    question: "根据文章，谁应该为保护环境做贡献？",
                    options: ["只有政府", "只有企业", "每个人", "环保组织"],
                    correct: 2
                }
            ]
        }
    }
};

let currentStory = null;
let userQuizAnswers = [];

function generate() {
    const lang = document.getElementById('sel-lang').value;
    const level = document.getElementById('sel-level').value;
    const wordsInput = document.getElementById('input-words').value;

    document.getElementById('loading').style.display = 'block';
    document.getElementById('game-content').style.display = 'none';
    document.getElementById('result').style.display = 'none';
    document.getElementById('btn-check').style.display = 'inline-block';
    document.getElementById('btn-retry').style.display = 'none';

    setTimeout(() => {
        currentStory = MOCK_STORIES[lang]?.[level] || MOCK_STORIES.en.intermediate;
        userQuizAnswers = new Array(currentStory.questions.length).fill(-1);
        renderStory();
        Bridge.send('generate', { gamemode: 'story', lang, level, words: wordsInput });
    }, 800);
}

function renderStory() {
    const storyEl = document.getElementById('story-text');
    let highlighted = currentStory.story;
    currentStory.words.forEach(w => {
        const re = new RegExp(`\\b(${w})\\b`, 'gi');
        highlighted = highlighted.replace(re, '<span class="highlight-word">$1</span>');
    });
    storyEl.innerHTML = highlighted;

    const wordsUsedEl = document.getElementById('story-words-used');
    wordsUsedEl.innerHTML = currentStory.words.map(w => `<strong>${w}</strong>`).join(', ');

    const quizContainer = document.getElementById('quiz-questions');
    quizContainer.innerHTML = '';

    currentStory.questions.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'question-card fade-in';
        card.style.marginBottom = '12px';

        const qText = document.createElement('div');
        qText.style.cssText = 'font-weight:500;margin-bottom:10px;font-size:14px;';
        qText.textContent = `${idx + 1}. ${q.question}`;
        card.appendChild(qText);

        const grid = document.createElement('div');
        grid.className = 'options-grid';
        q.options.forEach((opt, oi) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.dataset.q = idx;
            btn.dataset.opt = oi;
            btn.onclick = () => {
                userQuizAnswers[idx] = oi;
                grid.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
            };
            grid.appendChild(btn);
        });
        card.appendChild(grid);
        quizContainer.appendChild(card);
    });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('game-content').style.display = 'block';
}

function checkQuiz() {
    let correct = 0;
    const total = currentStory.questions.length;

    document.querySelectorAll('#quiz-questions .question-card').forEach((card, idx) => {
        const q = currentStory.questions[idx];
        const btns = card.querySelectorAll('.option-btn');
        btns.forEach((btn, oi) => {
            btn.disabled = true;
            btn.classList.remove('selected');
            if (oi === q.correct) btn.classList.add('correct');
            if (oi === userQuizAnswers[idx] && oi !== q.correct) btn.classList.add('wrong');
        });
        if (userQuizAnswers[idx] === q.correct) correct++;
    });

    document.getElementById('btn-check').style.display = 'none';
    document.getElementById('btn-retry').style.display = 'inline-block';

    const resultEl = document.getElementById('result');
    resultEl.style.display = 'block';
    resultEl.innerHTML = `
        <div class="score">${correct}/${total}</div>
        <div class="score-label">Reading comprehension: ${Math.round((correct/total)*100)}%</div>
        <div class="explanation">${correct === total ? 'Excellent reading comprehension!' : 'Review the story and try again.'}</div>
    `;
    resultEl.scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>

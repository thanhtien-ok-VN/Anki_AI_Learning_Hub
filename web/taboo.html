<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Taboo - AI Learning Hub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="timer-bar">
    <span class="timer-label">Session:</span>
    <span class="timer-value" id="timer-value">00:00</span>
    <div class="timer-controls">
        <button onclick="Utils.goTo('index.html')">Back to Hub</button>
    </div>
</div>

<div id="app" class="game-page" style="padding-top: 50px;">
    <div class="game-header">
        <button class="back-btn" onclick="Utils.goTo('index.html')">&larr; Back</button>
        <h2>🚫 AI Taboo</h2>
        <div></div>
    </div>

    <div class="config-panel">
        <div class="config-row">
            <label>Mode:</label>
            <select id="sel-mode">
                <option value="ai-describes" selected>AI Describes &rarr; You Guess</option>
                <option value="you-describe">You Describe &rarr; AI Guesses</option>
            </select>
            <label>Language:</label>
            <select id="sel-lang">
                <option value="en">English</option>
                <option value="zh">中文</option>
            </select>
            <label>Level:</label>
            <select id="sel-level">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
            </select>
            <label>Topic:</label>
            <select id="sel-topic">
                <option value="mixed">Mixed</option>
                <option value="daily_life">Daily Life</option>
                <option value="academic">Academic</option>
                <option value="technology">Technology</option>
            </select>
            <button class="btn" onclick="newRound()">New Round</button>
        </div>
    </div>

    <div id="loading" class="loading" style="display:none;">
        <div class="spinner"></div>
        <p>Taboo is thinking...</p>
    </div>

    <div id="game-content" style="display:none;">
        <div class="question-card taboo-card">
            <div id="round-info" style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">Round <span id="round-num">1</span></div>

            <div id="mode-ai-describes" style="display:none;">
                <div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">AI is describing a word. Guess what it is!</div>
                <div id="ai-description" class="description" style="font-size:16px;">Click "New Round" to start</div>
                <input type="text" id="guess-input" placeholder="Type your guess..." onkeydown="if(event.key==='Enter')submitGuess()">
                <button class="btn" id="btn-guess" onclick="submitGuess()" style="margin-top:8px;">Guess</button>
            </div>

            <div id="mode-you-describe" style="display:none;">
                <div class="secret-word" id="secret-word-display">_____</div>
                <div style="font-size:13px;color:var(--text-secondary);margin-bottom:4px;">Forbidden words (don't use these!):</div>
                <div class="forbidden" id="forbidden-words"></div>
                <textarea id="user-description" placeholder="Describe the word without using forbidden words..." style="width:100%;min-height:60px;border:2px solid var(--border);border-radius:8px;padding:10px;font-size:14px;font-family:var(--font);background:var(--bg);color:var(--text);resize:vertical;margin-top:12px;"></textarea>
                <button class="btn" id="btn-ai-guess" onclick="aiGuess()" style="margin-top:8px;">AI Guesses</button>
            </div>

            <div id="guess-result" style="margin-top:16px;font-size:16px;font-weight:500;"></div>
        </div>

        <div class="btn-group">
            <button class="btn btn-success" onclick="newRound()">Next Round</button>
        </div>

        <div id="scoreboard" style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-secondary);">
            Score: <span id="score-correct">0</span> correct / <span id="score-total">0</span> rounds
        </div>
    </div>

    <div id="result" class="result-card" style="display:none;"></div>
</div>

<script src="js/utils.js"></script>
<script src="js/bridge.js"></script>
<script>
const MOCK_TABOO = {
    ai_describes: [
        { word: "umbrella", forbidden: ["rain", "wet", "protect", "hold", "weather"], description: "You open it when water falls from the sky to stay dry." },
        { word: "bicycle", forbidden: ["ride", "wheel", "pedal", "vehicle", "two"], description: "You sit on it and move by pushing your feet in circles." },
        { word: "library", forbidden: ["book", "read", "quiet", "study", "borrow"], description: "A building where you can find knowledge for free." },
        { word: "camera", forbidden: ["photo", "picture", "lens", "phone", "capture"], description: "A device that freezes moments in time." },
        { word: "suitcase", forbidden: ["travel", "pack", "luggage", "bag", "clothes"], description: "You carry your belongings in this when going on a trip." }
    ],
    you_describe: [
        { word: "volcano", forbidden: ["mountain", "erupt", "lava", "fire", "hot"] },
        { word: "piano", forbidden: ["music", "play", "key", "instrument", "sound"] },
        { word: "internet", forbidden: ["online", "network", "website", "connection", "data"] },
        { word: "garden", forbidden: ["flower", "plant", "tree", "grow", "yard"] },
        { word: "mirror", forbidden: ["glass", "reflect", "face", "image", "look"] }
    ]
};

let currentRound = 0;
let currentData = null;
let scoreCorrect = 0;
let scoreTotal = 0;
let mode = 'ai-describes';

function newRound() {
    mode = document.getElementById('sel-mode').value;
    const lang = document.getElementById('sel-lang').value;
    const level = document.getElementById('sel-level').value;
    const topic = document.getElementById('sel-topic').value;

    document.getElementById('loading').style.display = 'block';
    document.getElementById('game-content').style.display = 'none';
    document.getElementById('guess-result').textContent = '';

    setTimeout(() => {
        const pool = mode === 'ai-describes' ? MOCK_TABOO.ai_describes : MOCK_TABOO.you_describe;
        currentData = pool[currentRound % pool.length];
        currentRound++;

        document.getElementById('round-num').textContent = currentRound;
        document.getElementById('mode-ai-describes').style.display = mode === 'ai-describes' ? 'block' : 'none';
        document.getElementById('mode-you-describe').style.display = mode === 'you-describe' ? 'block' : 'none';

        if (mode === 'ai-describes') {
            document.getElementById('ai-description').textContent = currentData.description;
            document.getElementById('guess-input').value = '';
            document.getElementById('guess-input').focus();
        } else {
            document.getElementById('secret-word-display').textContent = currentData.word;
            const forbiddenEl = document.getElementById('forbidden-words');
            forbiddenEl.innerHTML = currentData.forbidden.map(w => `<span>${w}</span>`).join('');
            document.getElementById('user-description').value = '';
        }

        document.getElementById('loading').style.display = 'none';
        document.getElementById('game-content').style.display = 'block';
        Bridge.send('generate', { gamemode: 'taboo', mode, lang, level, topic });
    }, 400);
}

function submitGuess() {
    const guess = document.getElementById('guess-input').value.trim();
    if (!guess) return;

    const resultEl = document.getElementById('guess-result');
    const isCorrect = guess.toLowerCase() === currentData.word.toLowerCase();

    scoreTotal++;
    if (isCorrect) { scoreCorrect++; }

    resultEl.innerHTML = isCorrect
        ? `<span style="color:var(--success)">&#10003; Correct! The word was <strong>${currentData.word}</strong></span>`
        : `<span style="color:var(--error)">&#10007; Not this time. The word was <strong>${currentData.word}</strong></span>`;

    document.getElementById('guess-input').disabled = true;
    document.getElementById('btn-guess').disabled = true;
    updateScore();
}

function aiGuess() {
    const description = document.getElementById('user-description').value.trim();
    if (!description) { Utils.toast('Please write a description first!'); return; }

    const resultEl = document.getElementById('guess-result');
    document.getElementById('btn-ai-guess').disabled = true;

    setTimeout(() => {
        scoreTotal++;
        resultEl.innerHTML = `
            <div style="font-size:14px;color:var(--text-secondary);margin-bottom:4px;">AI guessed:</div>
            <div style="font-size:20px;font-weight:600;color:var(--primary);">${currentData.word}!</div>
            <div style="font-size:13px;color:var(--text-secondary);margin-top:4px;">
                Your description: "${description}"<br>
                Forbidden words: ${currentData.forbidden.join(', ')}
            </div>
        `;
        scoreCorrect++;
        updateScore();
    }, 500);
}

function updateScore() {
    document.getElementById('score-correct').textContent = scoreCorrect;
    document.getElementById('score-total').textContent = scoreTotal;
}

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('sel-mode').addEventListener('change', () => newRound());
});
</script>
</body>
</html>

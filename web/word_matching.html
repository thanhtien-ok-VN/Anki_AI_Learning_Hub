<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Matching - AI Learning Hub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="timer-bar">
    <span class="timer-label">Session:</span>
    <span class="timer-value" id="timer-value">00:00</span>
    <div class="timer-controls">
        <button onclick="Utils.goTo('index.html')">Back to Hub</button>
    </div>
</div>

<div id="app" class="game-page" style="padding-top: 50px;">
    <div class="game-header">
        <button class="back-btn" onclick="Utils.goTo('index.html')">&larr; Back</button>
        <h2>🔗 Word Matching</h2>
        <div></div>
    </div>

    <div class="config-panel">
        <div class="config-row">
            <label>Pairs:</label>
            <select id="sel-pairs">
                <option value="5">5</option>
                <option value="8" selected>8</option>
                <option value="12">12</option>
            </select>
            <label>Source:</label>
            <select id="sel-source">
                <option value="builtin">Built-in Vocabulary</option>
                <option value="deck">From My Anki Deck</option>
            </select>
            <button class="btn" onclick="generate()">Generate</button>
        </div>
    </div>

    <div id="loading" class="loading" style="display:none;">
        <div class="spinner"></div>
        <p>Setting up matching game...</p>
    </div>

    <div id="game-content" style="display:none;">
        <div class="question-card">
            <div class="q-number">Click a term, then click its definition</div>
            <div class="match-columns" id="match-area">
                <div class="match-column">
                    <h4>Terms</h4>
                    <div id="left-col"></div>
                </div>
                <div class="match-column">
                    <h4>Definitions</h4>
                    <div id="right-col"></div>
                </div>
            </div>
            <div id="match-status" style="text-align:center;margin-top:12px;font-size:13px;color:var(--text-secondary);"></div>
        </div>
        <div class="btn-group">
            <button class="btn" id="btn-reset" onclick="resetGame()">Reset</button>
        </div>
    </div>

    <div id="result" class="result-card" style="display:none;"></div>
</div>

<script src="js/utils.js"></script>
<script src="js/bridge.js"></script>
<script>
const BUILTIN_PAIRS = {
    en: [
        { term: "ubiquitous", definition: "present, appearing, or found everywhere" },
        { term: "pragmatic", definition: "dealing with things in a practical way" },
        { term: "ambiguous", definition: "open to more than one interpretation" },
        { term: "eloquent", definition: "fluent or persuasive in speaking or writing" },
        { term: "resilient", definition: "able to recover quickly from difficulties" },
        { term: "ephemeral", definition: "lasting for a very short time" },
        { term: "consensus", definition: "a general agreement among a group" },
        { term: "deteriorate", definition: "to become progressively worse" },
        { term: "scrutiny", definition: "critical observation or examination" },
        { term: "advocate", definition: "to publicly recommend or support" },
        { term: "inevitable", definition: "certain to happen; unavoidable" },
        { term: "mitigate", definition: "to make less severe or serious" },
        { term: "paradigm", definition: "a typical example or pattern of something" },
        { term: "verbose", definition: "using more words than needed" },
        { term: "concise", definition: "giving a lot of information briefly" },
        { term: "hypothesis", definition: "a proposed explanation made as a starting point" },
        { term: "comprehensive", definition: "including all elements or aspects" },
        { term: "perceive", definition: "to become aware of through the senses" },
        { term: "plausible", definition: "seeming reasonable or probable" },
        { term: "articulate", definition: "having the ability to speak fluently and clearly" }
    ],
    zh: [
        { term: "方便", definition: "convenient; handy" },
        { term: "传统", definition: "tradition; traditional" },
        { term: "根据", definition: "according to; based on" },
        { term: "影响", definition: "influence; effect" },
        { term: "经验", definition: "experience" },
        { term: "关系", definition: "relationship; connection" },
        { term: "环境", definition: "environment; surroundings" },
        { term: "经济", definition: "economy; economic" },
        { term: "文化", definition: "culture; cultural" },
        { term: "发展", definition: "development; to develop" },
        { term: "技术", definition: "technology; technique" },
        { term: "态度", definition: "attitude" }
    ]
};

let currentPairs = [];
let leftItems = [];
let rightItems = [];
let selectedLeft = null;
let matchedPairs = new Set();
let attempts = 0;

function generate() {
    const count = parseInt(document.getElementById('sel-pairs').value);
    const source = document.getElementById('sel-source').value;

    document.getElementById('loading').style.display = 'block';
    document.getElementById('game-content').style.display = 'none';
    document.getElementById('result').style.display = 'none';

    setTimeout(() => {
        const pool = source === 'builtin' ? (BUILTIN_PAIRS.en || BUILTIN_PAIRS.en) : BUILTIN_PAIRS.en;
        const shuffled = Utils.shuffle(pool).slice(0, count);

        currentPairs = shuffled;
        matchedPairs = new Set();
        selectedLeft = null;
        attempts = 0;

        leftItems = Utils.shuffle(shuffled.map(p => p.term));
        rightItems = Utils.shuffle(shuffled.map(p => p.definition));

        renderColumns();
        updateStatus();

        document.getElementById('loading').style.display = 'none';
        document.getElementById('game-content').style.display = 'block';
        Bridge.send('generate', { gamemode: 'matching', count, source });
    }, 300);
}

function renderColumns() {
    const leftCol = document.getElementById('left-col');
    const rightCol = document.getElementById('right-col');
    leftCol.innerHTML = '';
    rightCol.innerHTML = '';

    leftItems.forEach((term) => {
        const div = document.createElement('div');
        div.className = 'match-item';
        div.textContent = term;
        div.dataset.type = 'left';
        div.dataset.value = term;
        div.onclick = () => clickLeft(div, term);
        if (matchedPairs.has(term)) {
            div.classList.add('matched');
            div.onclick = null;
        }
        leftCol.appendChild(div);
    });

    rightItems.forEach((def) => {
        const div = document.createElement('div');
        div.className = 'match-item';
        div.textContent = def;
        div.dataset.type = 'right';
        div.dataset.value = def;
        div.onclick = () => clickRight(div, def);
        if (Array.from(matchedPairs).some(t => getPairByTerm(t).definition === def)) {
            div.classList.add('matched');
            div.onclick = null;
        }
        rightCol.appendChild(div);
    });
}

function getPairByTerm(term) {
    return currentPairs.find(p => p.term === term);
}

function clickLeft(el, term) {
    if (matchedPairs.has(term)) return;

    document.querySelectorAll('#left-col .match-item').forEach(e => e.classList.remove('selected'));
    el.classList.add('selected');
    selectedLeft = term;
}

function clickRight(el, def) {
    if (!selectedLeft) return;
    if (Array.from(matchedPairs).some(t => getPairByTerm(t).definition === def)) return;

    attempts++;
    const pair = getPairByTerm(selectedLeft);

    if (pair.definition === def) {
        matchedPairs.add(selectedLeft);
        renderColumns();
        updateStatus();
        document.querySelectorAll('#left-col .match-item.selected').forEach(e => e.classList.remove('selected'));
        selectedLeft = null;

        if (matchedPairs.size === currentPairs.length) {
            showResult();
        }
    } else {
        el.classList.add('wrong');
        setTimeout(() => el.classList.remove('wrong'), 300);
    }
}

function updateStatus() {
    const el = document.getElementById('match-status');
    el.textContent = `Matched: ${matchedPairs.size} / ${currentPairs.length}  |  Attempts: ${attempts}`;
}

function resetGame() {
    matchedPairs = new Set();
    selectedLeft = null;
    attempts = 0;
    generate();
}

function showResult() {
    const resultEl = document.getElementById('result');
    const accuracy = Math.round((currentPairs.length / attempts) * 100);
    resultEl.style.display = 'block';
    resultEl.innerHTML = `
        <div class="score">${currentPairs.length}/${currentPairs.length}</div>
        <div class="score-label">All matched! Accuracy: ${accuracy}%</div>
        <div class="explanation">
            ${currentPairs.map(p => `
                <div style="margin-bottom:4px;"><strong>${p.term}</strong> &mdash; ${p.definition}</div>
            `).join('')}
        </div>
    `;
    resultEl.scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>
